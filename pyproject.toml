[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jove-protocol-integrator"
version = "0.1.0"
description = "JoVE Manuscript (.doc/.docx) QA Linter, Semantic HTML/CSS Renderer, and PubMed Central NISO JATS 1.3 XML Integrator"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.2.0",
    "lxml>=5.0.0",
    "Pillow>=10.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
jove-integrator = "jove_integrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
